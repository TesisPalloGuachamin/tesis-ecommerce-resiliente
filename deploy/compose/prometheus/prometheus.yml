global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'tesis-ecommerce'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['prometheus:9090']

  # NOTE: Core API y Checkout Service metrics requieren dependencia micrometer-prometheus en pom.xml
  # Scrape jobs comentados hasta que la dependencia esté disponible en el backend
  # Descomenta estas líneas después de:
  #   1. Agregar <artifactId>micrometer-registry-prometheus</artifactId> a pom.xml
  #   2. Recompilar los servicios
  #   3. Reiniciar Prometheus
  
