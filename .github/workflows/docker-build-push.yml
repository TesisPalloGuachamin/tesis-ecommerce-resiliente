name: Docker Build and Push

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Core API
        working-directory: ./apps/core-api
        run: mvn clean package -DskipTests

      - name: Compile Checkout Service
        working-directory: ./apps/checkout-service
        run: mvn clean package -DskipTests

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Core API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/core-api
          push: true
          tags: |
            christopherpallo2000/tesis-core-api:latest
            christopherpallo2000/tesis-core-api:${{ steps.vars.outputs.sha_short }}

      - name: Build and Push Checkout Service
        uses: docker/build-push-action@v5
        with:
          context: ./apps/checkout-service
          push: true
          tags: |
            christopherpallo2000/tesis-checkout-service:latest
            christopherpallo2000/tesis-checkout-service:${{ steps.vars.outputs.sha_short }}
